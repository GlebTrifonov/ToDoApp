{% extends 'base.html' %}

{% block title %}Регистрация | ToDo App{% endblock %}

{% block content %}
<div style="max-width: 450px; margin: 0 auto; background: var(--card-bg); padding: 35px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);">
    <h2 style="margin-top: 0; margin-bottom: 10px; text-align: center;">Создать аккаунт</h2>
    <p style="color: var(--text-dim); text-align: center; margin-bottom: 30px; font-size: 0.9em;">Присоединяйтесь, чтобы сохранять свои списки дел</p>
    
    <form method="post">
        {% csrf_token %}
        
        <!-- Django по умолчанию выводит UserCreationForm списком <ul> или параграфами <p> -->
        <div class="auth-form">
            {{ form.as_p }}
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; padding: 12px; margin-top: 20px; font-size: 1em;">
            Зарегистрироваться
        </button>
    </form>
    
    <hr style="border: 0; border-top: 1px solid #333; margin: 25px 0;">
    
    <p style="text-align: center; color: var(--text-dim); font-size: 0.9em;">
        Уже есть профиль? <a href="{% url 'login' %}" style="color: var(--accent); font-weight: bold;">Войти здесь</a>
    </p>
</div>

<style>
    /* Небольшой хак для стилизации стандартных полей Django в темной теме */
    .auth-form input {
        width: 100%;
        padding: 10px;
        margin-bottom: 15px;
        background: #2c2c2c;
        border: 1px solid #444;
        color: white;
        border-radius: 4px;
        box-sizing: border-box;
    }
    .auth-form label {
        display: block;
        margin-bottom: 5px;
        font-size: 0.9em;
        color: var(--text-dim);
    }
    .helptext, .errorlist {
        font-size: 0.75em;
        color: var(--text-dim);
        margin-bottom: 15px;
        display: block;
    }
    .errorlist { color: var(--danger); }
</style>
{% endblock %}
