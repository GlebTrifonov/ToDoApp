<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Django ToDo{% endblock %}</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-main: #e0e0e0;
            --text-dim: #a0a0a0;
            --accent: #bb86fc;
            --danger: #cf6679;
            --success: #03dac6;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 50px;
        }
        .container { width: 90%; max-width: 600px; }
        a { color: var(--accent); text-decoration: none; }
        .btn {
            padding: 8px 16px;
            border-radius: 4px;
            border: none;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }
        .btn-primary { background: var(--accent); color: #000; }
        .btn-outline { background: transparent; border: 1px solid var(--accent); color: var(--accent); }
        .btn-danger { background: transparent; color: var(--danger); font-size: 0.8em; }
        input, textarea, select {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            background: #2c2c2c;
            border: 1px solid #444;
            color: white;
            border-radius: 4px;
            box-sizing: border-box;
        }
    </style>
</head>
<body>
    <div class="container">
        <header style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;">
            <h1>ToDo <span style="color: var(--accent);">App</span></h1>
            {% if user.is_authenticated %}
                <span style="color: var(--text-dim);">Привет, {{ user.username }}</span>
            {% endif %}
        </header>
        
        {% block content %}{% endblock %}
    </div>
</body>
</html>
