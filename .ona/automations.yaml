tasks:
  install-deps:
    name: Install dependencies
    description: Install Python dependencies from requirements.txt.
    command: pip install -r requirements.txt
    triggeredBy:
      - postDevcontainerStart

  migrate:
    name: Run migrations
    description: Apply Django database migrations.
    command: python manage.py migrate
    triggeredBy:
      - postDevcontainerStart
    dependsOn:
      - install-deps

services:
  dev-server:
    name: Dev Server
    description: Django development server on port 8000.
    commands:
      start: |
        until python manage.py migrate --check 2>/dev/null; do
          echo "Waiting for migrations..."
          sleep 2
        done
        python manage.py runserver 0.0.0.0:8000
      ready: curl -f http://localhost:8000
